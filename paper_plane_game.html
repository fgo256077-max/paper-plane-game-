<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101b35">
<title>طيّارة ورق - تحدّي السماء</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,Tahoma,Arial;background:#101b35;color:#fff}
body{display:grid;place-items:center}.game{position:relative;width:min(100vw,480px);height:min(100dvh,850px);overflow:hidden;background:linear-gradient(#6bd2ef 0%,#b7edee 65%,#f8d98a 100%);box-shadow:0 15px 60px #0008}
canvas{width:100%;height:100%;display:block;touch-action:manipulation}
.hud{position:absolute;top:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none;font-weight:900;text-shadow:0 2px 5px #16435c}
.pill{background:#10213acc;border:1px solid #ffffff55;border-radius:18px;padding:8px 14px;font-size:16px}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#07152a66;padding:24px;text-align:center}
.panel{width:100%;max-width:340px;background:#10213bee;border:2px solid #ffffff55;border-radius:25px;padding:25px 20px;box-shadow:0 15px 40px #0005}
h1{font-size:34px;margin:0 0 6px;color:#ffe08a}p{line-height:1.7;margin:8px 0 18px;color:#e4f6ff}
button{border:0;border-radius:16px;background:#ffb52e;color:#18223b;font-size:20px;font-weight:900;padding:13px 25px;width:100%;cursor:pointer;box-shadow:0 5px 0 #c77b12}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #c77b12}.small{font-size:13px;color:#c6d9ee;margin-top:16px}
.hidden{display:none}.best{color:#ffe08a;font-weight:800}
</style>
</head>
<body>
<div class="game">
<canvas id="c" width="480" height="850" aria-label="لعبة طيارة ورق"></canvas>
<div class="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">الأفضل: <span id="best">0</span></div></div>
<div class="overlay" id="start">
 <div class="panel"><h1>✈ طيّارة ورق</h1><p>حلّق فوق المدينة واجمع النقاط!<br>المس الشاشة أو اضغط مسافة لترتفع، وتجنّب المباني.</p><button id="play">ابدأ اللعب</button><div class="small">لعبة مجانية تجريبية — إصدار 1.0</div></div>
</div>
<div class="overlay hidden" id="over">
 <div class="panel"><h1>انتهت الرحلة!</h1><p>نتيجتك: <b id="final">0</b><br><span class="best">أفضل نتيجة: <span id="best2">0</span></span></p><button id="again">العب من جديد</button><div class="small">نصيحة: اضغط بلمسات قصيرة للتحكم في الارتفاع.</div></div>
</div>
</div>
<script>
(()=>{
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=480,H=850;
const $=id=>document.getElementById(id);
let state='ready',y=390,vy=0,score=0,best=+(localStorage.paperPlaneBest||0),pipes=[],frame=0,speed=3.1;
$('best').textContent=best;
function reset(){y=390;vy=0;score=0;pipes=[];frame=0;speed=3.1;$('score').textContent=0}
function start(){reset();state='playing';$('start').classList.add('hidden');$('over').classList.add('hidden')}
function flap(){if(state==='playing')vy=-7.2}
function end(){state='over';best=Math.max(best,score);localStorage.paperPlaneBest=best;$('best').textContent=best;$('best2').textContent=best;$('final').textContent=score;$('over').classList.remove('hidden')}
$('play').onclick=start;$('again').onclick=start;
c.addEventListener('pointerdown',e=>{e.preventDefault();flap()});
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(state==='ready')start();else flap()}});
function cloud(x,y,s){ctx.fillStyle='#ffffffaa';ctx.beginPath();ctx.arc(x,y,24*s,0,Math.PI*2);ctx.arc(x+25*s,y-10*s,30*s,0,Math.PI*2);ctx.arc(x+55*s,y,22*s,0,Math.PI*2);ctx.fill()}
function draw(){
ctx.clearRect(0,0,W,H);
let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#68cbea');g.addColorStop(.72,'#c6f0e5');g.addColorStop(1,'#f5d58b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
cloud(70,130,.8);cloud(330,210,.65);cloud(220,65,.45);
ctx.fillStyle='#75b7a2';ctx.beginPath();ctx.moveTo(0,570);ctx.lineTo(95,450);ctx.lineTo(190,570);ctx.lineTo(300,430);ctx.lineTo(480,590);ctx.lineTo(480,850);ctx.lineTo(0,850);ctx.fill();
ctx.fillStyle='#e9b66e';ctx.fillRect(0,730,W,120);
for(let i=0;i<6;i++){let x=i*95-(frame*speed*.45%95);ctx.fillStyle=i%2?'#f0a85c':'#e99a55';ctx.fillRect(x,600-(i%3)*25,58,150);ctx.fillStyle='#fff0b0';for(let j=0;j<3;j++)ctx.fillRect(x+10+j*15,620-(i%3)*25,7,12)}
if(state==='playing'){
frame++;vy+=.38;y+=vy;
if(frame%92===0){let gap=190,top=140+Math.random()*290;pipes.push({x:W+20,top,gap,passed:false})}
speed=3.1+Math.min(score*.035,2.2);
pipes.forEach(p=>{p.x-=speed;ctx.fillStyle='#277c67';ctx.fillRect(p.x,0,72,p.top);ctx.fillRect(p.x,p.top+p.gap,72,H);ctx.fillStyle='#1c624f';ctx.fillRect(p.x-6,p.top-18,84,18);ctx.fillRect(p.x-6,p.top+p.gap,84,18);
if(!p.passed&&p.x+72<105){p.passed=true;score++;$('score').textContent=score}
if(105+23>p.x&&105-23<p.x+72&&(y-15<p.top||y+15>p.top+p.gap))end()});
pipes=pipes.filter(p=>p.x>-100);
if(y<0||y>H-105)end();
}else{
pipes=[{x:310,top:180,gap:210}];pipes.forEach(p=>{ctx.fillStyle='#277c67';ctx.fillRect(p.x,0,72,p.top);ctx.fillRect(p.x,p.top+p.gap,72,H);ctx.fillStyle='#1c624f';ctx.fillRect(p.x-6,p.top-18,84,18);ctx.fillRect(p.x-6,p.top+p.gap,84,18)})
}
 // paper plane
ctx.save();ctx.translate(105,y);ctx.rotate(Math.max(-.35,Math.min(.55,vy*.045)));
ctx.fillStyle='#fff';ctx.strokeStyle='#35728b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-28,0);ctx.lineTo(30,-15);ctx.lineTo(8,3);ctx.lineTo(30,16);ctx.closePath();ctx.fill();ctx.stroke();
ctx.beginPath();ctx.moveTo(-28,0);ctx.lineTo(8,3);ctx.lineTo(30,-15);ctx.stroke();ctx.restore();
if(state!=='playing'&&state!=='over'){ctx.fillStyle='#16435c';ctx.font='bold 24px system-ui';ctx.textAlign='center';ctx.fillText('استعد للتحليق!',240,680)}
requestAnimationFrame(draw)
}
draw();
})();
</script>
</body></html>
